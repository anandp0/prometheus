global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 10.0.1.180:9100     # engine-master
          - 10.0.150.59:9100    # k8s-worker-node-0
          - 10.0.141.227:9100   # k8s-worker-node-1
    relabel_configs:
      - source_labels: [__address__]
        regex: 10.0.1.180:9100
        target_label: nodename
        replacement: engine-master
      - source_labels: [__address__]
        regex: 10.0.150.59:9100
        target_label: nodename
        replacement: k8s-worker-node-0
      - source_labels: [__address__]
        regex: 10.0.141.227:9100
        target_label: nodename
        replacement: k8s-worker-node-1
