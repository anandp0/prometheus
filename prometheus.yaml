# Global configuration
global:
  scrape_interval: 15s # Scrape interval every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 172.17.0.12:9093

# Load rules and alerts
rule_files:
  - /opt/bitnami/prometheus/conf/rules.yaml
  - /opt/bitnami/prometheus/conf/alerts.yaml

# Scrape configurations
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'windows_server'
    static_configs:
      - targets: ['13.203.155.99:9182']
        labels:
          instance: 'windows-server'
