groups:
- name: Test-CPU-Usage
  rules:
  - alert: TestHighCPU
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 1
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "TEST: High CPU load on {{ $labels.instance }}"
      description: "⚠️ TEST ALERT: CPU load > 1%\nVALUE = {{ $value }}\nLABELS = {{ $labels }}"

- name: Test-Disk-Usage
  rules:
  - alert: TestDiskUsage
    expr: ceil(((node_filesystem_size_bytes{mountpoint!="/boot"} - node_filesystem_free_bytes{mountpoint!="/boot"}) / node_filesystem_size_bytes{mountpoint!="/boot"} * 100)) > 1
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "TEST: Disk usage warning on {{ $labels.instance }}"
      description: "⚠️ TEST ALERT: Disk usage > 1%\nVALUE = {{ $value }}%\nPartition: {{ $labels.mountpoint }}"

- name: Test-Memory-Usage
  rules:
  - alert: TestMemoryPressure
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 99
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "TEST: Memory pressure on {{ $labels.instance }}"
      description: "⚠️ TEST ALERT: Less than 99% memory available\nVALUE = {{ $value }}%\nLABELS = {{ $labels }}"

- name: Blackbox-Exporter-Alerts
  rules:
  - alert: BlackboxTargetDown
    expr: probe_success == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "🚨 Probe failed for {{ $labels.instance }}"
      description: "Target {{ $labels.instance }} is DOWN (probe failed)\nVALUE = {{ $value }}"

  - alert: BlackboxHighLatency
    expr: probe_duration_seconds > 5
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "⚠️ High probe duration for {{ $labels.instance }}"
      description: "Probe took more than 5s\nVALUE = {{ $value }}"

  - alert: BlackboxSSLCertExpiringSoon
    expr: (probe_ssl_earliest_cert_expiry - time()) < 86400 * 7
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "⚠️ SSL Certificate expiring soon for {{ $labels.instance }}"
      description: "SSL cert expires in less than 7 days\nVALUE = {{ $value }} (seconds until expiry)"


